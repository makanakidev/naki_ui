name: Feature Request
description: Propose a new component, theme capability, framework utility, or CLI improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Components (naki_ui.dart)
        - Theming & Styling (theme.dart)
        - Framework, Overlays & Controllers (framework.dart)
        - CLI & Skills (naki_ui / skills)
        - Documentation / Example App
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem does this solve, or what UI pattern is currently difficult?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / API
      description: Sketch how you would expect to use this in Dart/Jaspr.
      placeholder: |
        ```dart
        // Example API usage
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or alternative designs you have considered.
