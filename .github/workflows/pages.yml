name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        # Dart 3.13 until Jaspr supports analyzer 13: jaspr_builder 0.23.5 needs
        # analyzer ^12, and every build_web_compilers for Dart 3.14 needs >=13.3.
        with:
          sdk: 3.13.7
      - name: Build Jaspr
        working-directory: example
        run: |
          dart pub global activate jaspr_cli
          dart pub get
          jaspr build -v --dart-define=BASE_PATH=/naki_ui
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/jaspr
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
