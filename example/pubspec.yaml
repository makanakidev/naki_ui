name: naki_ui_example
publish_to: none
description: Example application for the naki_ui package.

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  jaspr: ^0.23.4
  naki_ui:
    path: ../

dev_dependencies:
  build_runner: ^2.6.0
  build_web_compilers: ^4.2.4
  jaspr_builder: ^0.23.4

jaspr:
  mode: static
  styles: standalone
  port: 3000
